name: Public host checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-host-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publication-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, immutable pin
        with:
          persist-credentials: false
          submodules: false
      - run: python3 -B tools/audit_public.py
      - run: python3 -B tools/render_progress.py --check
      - run: python3 -B -m unittest discover -s tests -v
  host-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, immutable pin
        with:
          persist-credentials: false
          submodules: false
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
  host-windows:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, immutable pin
        with:
          persist-credentials: false
          submodules: false
      - run: cmake -S . -B build
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: cmake -S . -B build-h10 -DTM_PUBLIC_H10_REFERENCE=ON
      - run: cmake --build build-h10 --config Release --target tm2012_h10_reference
      - run: ctest --test-dir build-h10 -C Release -R h10_reference_host --output-on-failure
